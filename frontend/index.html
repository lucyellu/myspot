<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>myspot</title>
<link rel="icon" type="image/x-icon" href="/static/icon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Pixelify+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;700&family=Bebas+Neue&family=Playfair+Display:wght@400;700&family=Space+Grotesk:wght@400;700&family=Nunito:wght@400;700&family=Dancing+Script:wght@700&display=swap" />
<link rel="stylesheet" href="/static/css/app.css?v=radio-onehour1" />
<!-- Runtime config: sets window.MYSPOT_API_BASE for static deploys. Optional;
     missing file is fine (same-origin fallback). -->
<script src="/static/config.js" onerror="this.remove()"></script>
<script>
  (function () {
    var s = localStorage.getItem("myspot_api_base");
    if (s) window.MYSPOT_API_BASE = s;
  })();
</script>
</head>
<body>
<header class="topbar">
  <button class="ico-btn" id="btn-menu" title="Channels">▤</button>
  <a class="brand" href="#/">MYSPOT</a>
  <a class="topbar-link" id="topbar-radio" href="#/radio">RADIO</a>
  <input id="search" class="search" type="search" placeholder="SEARCH..." />
  <div class="topbar-spacer"></div>
  <span class="stats" id="topbar-stats"></span>
  <button class="ico-btn" id="btn-theme" title="Theme">◐</button>
  <button class="ico-btn" id="btn-reindex" title="Re-scan library">↻</button>
  <button class="ico-btn" id="btn-fingerprint" title="Compute audio fingerprints">♫</button>
  <button class="ico-btn" id="btn-api" title="Backend URL">⚙</button>
</header>

<div id="api-pop" class="api-pop" hidden>
  <label class="api-pop-label">BACKEND URL</label>
  <input type="url" id="api-url-input" class="api-url-input" placeholder="https://xxxx.trycloudflare.com" />
  <div class="muted small" id="api-current"></div>
  <div class="actions">
    <button class="btn" type="button" id="api-save">SAVE &amp; RELOAD</button>
    <button class="btn" type="button" id="api-clear">CLEAR</button>
  </div>
</div>

<div id="theme-pop" class="theme-pop" hidden>
  <label>HUE</label>
  <input type="range" id="theme-hue" min="0" max="360" step="1" />
  <div class="theme-preset-row" id="theme-presets"></div>
  <div class="row">
    <span>SAT</span>
    <input type="range" id="theme-sat" min="0" max="100" step="1" />
    <span class="swatch" id="theme-swatch"></span>
  </div>
  <div class="row">
    <span>LIG</span>
    <input type="range" id="theme-lig" min="20" max="80" step="1" />
  </div>
  <div class="actions">
    <button class="btn" type="button" id="theme-toggle-mode">CONTRAST MODE</button>
    <button class="btn" type="button" id="theme-reset">RESET</button>
  </div>
</div>

<aside class="sidedrawer" id="sidedrawer">
  <details class="drawer-section" id="drawer-smart" open>
    <summary><span class="drawer-section-h">SMART</span><span class="drawer-section-n" id="drawer-smart-n"></span></summary>
    <div class="channel-list">
      <a href="#/radio"><span class="count">HOST</span>AI RADIO</a>
      <a href="#/live-boards"><span class="count">PREVIZ</span>LIVE BOARDS</a>
    </div>
    <div id="smart-tag-list" class="channel-list"></div>
  </details>
  <details class="drawer-section" id="drawer-channels">
    <summary><span class="drawer-section-h">CHANNELS</span><span class="drawer-section-n" id="drawer-channels-n"></span></summary>
    <div id="channel-list" class="channel-list"></div>
  </details>
  <details class="drawer-section" id="drawer-folders">
    <summary><span class="drawer-section-h">FOLDERS</span><span class="drawer-section-n" id="drawer-folders-n"></span></summary>
    <div id="asset-folder-list" class="channel-list"></div>
  </details>
  <div id="drawer-resize" class="drawer-resize" title="Resize library lane"></div>
</aside>

<main id="view"></main>

<div id="persistent-player" class="persistent-player" hidden>
  <button class="pp-art" id="pp-art" type="button" title="Open current song">♫</button>
  <div class="pp-info">
    <a id="pp-title" class="pp-title" href="#/"></a>
    <div id="pp-meta" class="pp-meta"></div>
  </div>
  <button class="pp-btn" id="pp-prev" type="button" title="Previous">⏮</button>
  <button class="pp-btn pp-play" id="pp-play" type="button" title="Play / pause">▶</button>
  <button class="pp-btn" id="pp-next" type="button" title="Next">⏭</button>
  <button class="pp-btn pp-stop" id="pp-stop" type="button" title="Stop playback">■</button>
  <input type="range" class="pp-scrub" id="pp-scrub" min="0" max="1000" value="0" step="1" aria-label="Seek" />
  <span class="pp-time" id="pp-time">0:00 / 0:00</span>
  <button class="pp-btn" id="pp-mute" type="button" title="Mute">🔊</button>
  <input type="range" class="pp-vol" id="pp-vol" min="0" max="100" value="100" step="1" aria-label="Volume" />
  <button class="pp-btn" id="pp-collapse" type="button" title="Compact player">▾</button>
  <button class="pp-btn pp-close" id="pp-close" type="button" title="Turn player off">×</button>
  <audio id="global-audio" preload="metadata"></audio>
</div>

<template id="tpl-home">
  <section class="home">
    <div class="home-header">
      <h1 id="home-title">RECENT</h1>
      <div class="home-controls">
        <label class="control-group">SORT
          <select id="home-sort">
            <option value="recent">RECENT</option>
            <option value="popular">POPULAR</option>
            <option value="liked">LIKED</option>
            <option value="gens">MOST GENS</option>
            <option value="recent_played">PLAYED</option>
            <option value="title">TITLE</option>
            <option value="version">VERSION</option>
          </select>
          <button id="btn-sort-dir" class="ico-btn" title="Toggle sort direction">↓</button>
        </label>
        <label class="control-group control-size">SIZE
          <input type="range" id="home-size" min="40" max="280" step="10" />
        </label>
        <div class="control-group view-toggle" role="radiogroup" aria-label="View mode">
          <button type="button" class="view-btn" data-view="grid" title="Grid view">▦</button>
          <button type="button" class="view-btn" data-view="list" title="List view">☰</button>
        </div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="grid-footer">
      <button id="btn-more" class="btn">LOAD MORE</button>
      <span id="grid-status" class="muted"></span>
    </div>
  </section>
</template>

<template id="tpl-watch">
  <section class="watch" id="watch-lanes">
    <section class="watch-lane lane-stage" data-lane="stage" draggable="true">
      <div class="lane-head">
        <button class="lane-collapse" type="button" title="Collapse stage">−</button>
        <span class="lane-title">STAGE</span>
        <span class="lane-hint">player · lyrics · track</span>
        <button class="lane-mode-btn on" id="tp-karaoke" type="button" title="Karaoke lyric overlay">KARAOKE</button>
      </div>
      <div class="lane-body watch-main">
        <div class="player">
          <div class="player-stage">
            <div class="visual" id="visual"></div>
            <canvas id="halftone" class="halftone-overlay"></canvas>
            <div class="drop-overlay" id="drop-overlay">DROP TO ADD TO TRACK</div>
            <div class="lyric-overlay" id="lyric-overlay" hidden></div>
          </div>
          <div class="transport" id="transport">
            <span class="lcd-label" id="lcd-status">▶</span>
            <button class="tp-btn" id="tp-prev" type="button" title="Previous (P)">⏮</button>
            <button class="tp-btn tp-play" id="tp-play" type="button" title="Play / pause (Space)">▶</button>
            <button class="tp-btn" id="tp-next" type="button" title="Next (N)">⏭</button>
            <input type="range" class="tp-scrub" id="tp-scrub" min="0" max="1000" value="0" step="1" />
            <span class="lcd-time" id="lcd-time-cur">00:00</span>
            <span class="lcd-sep">/</span>
            <span class="lcd-time" id="lcd-time-tot">00:00</span>
            <span class="lcd-label" id="lcd-bpm" hidden></span>
            <span class="lcd-label" id="lcd-version" hidden></span>
            <button class="tp-btn tp-mute" id="tp-mute" type="button" title="Mute (M)">🔊</button>
            <input type="range" class="tp-vol" id="tp-vol" min="0" max="100" value="100" step="1" title="Volume" />
          </div>
        </div>
        <div class="lyric-strip-host" id="lyric-strip-host"></div>
        <div class="track-strip" id="track-strip">
          <div class="track-empty">DROP IMAGES / VIDEOS / ASSETS HERE TO BUILD YOUR TRACK</div>
        </div>
        <div class="meta">
          <h1 id="song-title"></h1>
          <div class="meta-row">
            <a class="chip" id="meta-account"></a>
            <span class="chip ver" id="meta-version" hidden></span>
            <span class="chip" id="meta-duration"></span>
            <span class="chip" id="meta-bpm" hidden></span>
            <span class="chip" id="meta-date" hidden></span>
            <button class="chip-btn" id="btn-like" type="button" title="Like (1 to toggle)">♡</button>
          </div>
          <div class="genre" id="meta-genre"></div>
        </div>
      </div>
    </section>
    <div class="lane-resizer" data-resize-before="stage" data-resize-after="media" title="Resize lanes"></div>
    <section class="watch-lane lane-media" data-lane="media" draggable="true">
      <div class="lane-head">
        <button class="lane-collapse" type="button" title="Collapse media">−</button>
        <span class="lane-title">MEDIA</span>
        <select id="media-tray-folder" class="media-tray-folder" title="Media folder"></select>
        <span class="media-tray-path lane-hint" id="media-tray-path"></span>
      </div>
      <div class="lane-body shelves">
        <div class="shelf" id="media-tray">
          <div class="media-tray-body">
            <div id="tray-bulk-bar" class="tray-bulk-bar" hidden>
              <span class="tray-bulk-count"></span>
              <button class="btn" type="button" id="tray-bulk-attach">Attach selected to song</button>
              <button class="btn" type="button" id="tray-bulk-clear">Clear</button>
            </div>
            <div class="media-tray-grid" id="media-tray-grid"></div>
            <div class="media-tray-footer">
              <button class="btn" id="media-tray-more" type="button">LOAD MORE</button>
              <span class="muted small" id="media-tray-status"></span>
            </div>
          </div>
        </div>
        <div class="shelf shelf-songs">
          <div class="shelf-head"><span class="shelf-title">UP NEXT</span></div>
          <div class="up-next" id="up-next"></div>
        </div>
      </div>
    </section>
    <div class="lane-resizer" data-resize-before="media" data-resize-after="studio" title="Resize lanes"></div>
    <aside class="watch-lane lane-studio sidepanel" data-lane="studio" draggable="true">
      <div class="lane-head">
        <button class="lane-collapse" type="button" title="Collapse studio">−</button>
        <span class="lane-title">STUDIO</span>
        <span class="lane-hint">generate · lyrics · design</span>
      </div>
      <div class="lane-body">
        <nav class="tabs fm-dial" id="tabs">
          <div class="fm-tick">
            <button data-tab="dj"><span class="fm-freq" data-count="dj">ON</span><span class="fm-name">DJ</span></button>
            <button data-tab="generate" class="active"><span class="fm-freq" data-count="generate">0</span><span class="fm-name">GENERATE</span></button>
            <button data-tab="lyrics"><span class="fm-freq" data-count="lyrics">0</span><span class="fm-name">LYRICS</span></button>
            <button data-tab="design"><span class="fm-freq" data-count="design">·</span><span class="fm-name">DESIGN</span></button>
            <button data-tab="sources"><span class="fm-freq" data-count="sources">0</span><span class="fm-name">SOURCES</span></button>
            <button data-tab="prompts"><span class="fm-freq" data-count="prompts">0</span><span class="fm-name">PROMPTS</span></button>
            <button data-tab="batch"><span class="fm-freq" data-count="batch">0</span><span class="fm-name">BATCH</span></button>
          </div>
        </nav>
        <div class="tab-body" id="tab-body"></div>
      </div>
    </aside>
  </section>
</template>

<template id="tpl-card">
  <article class="card">
    <a class="thumb">
      <img loading="lazy" alt="" />
      <span class="card-version"></span>
      <span class="card-duration"></span>
      <span class="card-liked" hidden>♥</span>
    </a>
    <div class="card-body">
      <a class="card-title"></a>
      <div class="card-sub"><span class="card-dot"></span></div>
    </div>
  </article>
</template>

<div id="toast" class="toast" hidden></div>

<div id="help-overlay" class="help-overlay" hidden>
  <div class="help-card">
    <h3>SHORTCUTS</h3>
    <table>
      <tr><td><kbd>SPC</kbd> / <kbd>K</kbd></td><td>play / pause</td></tr>
      <tr><td><kbd>J</kbd> / <kbd>L</kbd></td><td>seek -10s / +10s</td></tr>
      <tr><td><kbd>M</kbd></td><td>mute</td></tr>
      <tr><td><kbd>N</kbd></td><td>next</td></tr>
      <tr><td><kbd>P</kbd></td><td>previous</td></tr>
      <tr><td><kbd>1</kbd>-<kbd>7</kbd></td><td>switch tab</td></tr>
      <tr><td><kbd>/</kbd></td><td>focus search</td></tr>
      <tr><td><kbd>?</kbd></td><td>this help</td></tr>
      <tr><td><kbd>ESC</kbd></td><td>close</td></tr>
    </table>
    <button class="btn" id="help-close">CLOSE</button>
  </div>
</div>

<script type="module" src="/static/js/main.js?v=radio-onehour1"></script>
</body>
</html>
